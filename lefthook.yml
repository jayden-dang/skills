# Git hooks for the skills repo.
#
# This file was deleted by accident in 733fb1c ("chrone: update the docs", a
# commit whose only change was removing it), which silently disabled every
# check below while README kept telling contributors to run `lefthook install`.
# Restored with two corrections: lint-handoffs.py is now lint-write-handoffs.py,
# and the `tests` target is dropped because that directory no longer exists.
#
# skill-frontmatter guards against a malformed SKILL.md silently disappearing
# from the skills catalog: the vercel `skills` CLI skips any file whose
# frontmatter YAML fails to parse, with no error, so `npx skills add` would
# quietly find N-1 skills. It also fails a missing or malformed `version`.
# See scripts/lint-skill-frontmatter.py.
#
# handoffs guards against a dead-end hand-off: a body telling the agent to
# invoke a skill carrying `disable-model-invocation: true`, which it cannot do.
# See scripts/lint-write-handoffs.py.
#
# context7 guards against a library-reasoning skill silently losing its Context7
# reference: those skills prefer the Context7 MCP over training-cutoff memory,
# and that preference lives only in prose. See scripts/lint-context7.py.
#
# evals guards the grounding rule: an eval.json must sit beside a TESTS.md, so
# runnable assertions trace to a recorded RED/GREEN run rather than to a guess
# about what agents get wrong. See scripts/lint-skill-evals.py.
#
# templates guards consumer-local copies of pack seeds: `npx skills add` copies
# only the skill folder, so every templates/<path> a SKILL.md cites must exist
# beside that skill and match repo-root templates/ (the authoring SSOT).
# See scripts/lint-skill-templates.py.
#
# Run `lefthook install` once to wire these into .git/hooks.

pre-commit:
  commands:
    skill-frontmatter:
      glob: "skills/**/SKILL.md"
      run: python3 scripts/lint-skill-frontmatter.py {staged_files}
    evals:
      glob: "skills/**/eval.json"
      run: python3 scripts/lint-skill-evals.py {staged_files}
    handoffs:
      glob: "skills/**/SKILL.md"
      # Cross-skill check — always scans the whole set, not just staged files.
      run: python3 scripts/lint-write-handoffs.py
    context7:
      glob: "skills/**/SKILL.md"
      # Fixed-set check — always scans the whole set, not just staged files.
      run: python3 scripts/lint-context7.py
    templates:
      glob: "{skills/**/SKILL.md,templates/**}"
      # Cross-skill check — always scans the whole set, not just staged files.
      run: python3 scripts/lint-skill-templates.py

pre-push:
  commands:
    skill-frontmatter:
      # Full scan before anything reaches origin (where the CLI reads).
      run: python3 scripts/lint-skill-frontmatter.py
    evals:
      run: python3 scripts/lint-skill-evals.py
    handoffs:
      run: python3 scripts/lint-write-handoffs.py
    context7:
      run: python3 scripts/lint-context7.py
    templates:
      run: python3 scripts/lint-skill-templates.py
